name: hermes-zap-proxy
version: 0.2.0
description: "DAST scanning via the kotoba-lang/zap-proxy decision core. Every scan requires a current human-reviewed approval record binding the authorized approver, exact assets and paths, scan mode, and expiry."
author: "kotoba-lang"
kind: standalone
provides_tools:
  - zap_scan
  - zap_scan_active
  - zap_scan_rules
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/kotoba-lang/zap-proxy
tags: [security, dast, scanner]
config_schema:
  zap_proxy_targets:
    type: list
    default: []
    description: "Legacy inventory only; never grants scan authorization."
